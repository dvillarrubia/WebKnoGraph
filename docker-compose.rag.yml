# WebKnoGraph Graph-RAG Docker Compose
# RAG API + Crawler Service (separate containers) + Supabase + Neo4j

version: '3.8'

services:
  # ==========================================================================
  # GRAPH-RAG API SERVICE
  # ==========================================================================
  graph-rag-api:
    build:
      context: .
      dockerfile: graph_rag/Dockerfile
    container_name: graph-rag-api
    ports:
      - "8080:8080"
    environment:
      # App
      - DEBUG=false

      # Crawler Service (separate container)
      - CRAWLER_SERVICE_URL=http://crawler-service:8081

      # Supabase (adjust to your existing setup)
      - SUPABASE_URL=http://seo-supabase-api:3000
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_DB_HOST=seo-supabase-db
      - SUPABASE_DB_PORT=5432
      - SUPABASE_DB_NAME=postgres
      - SUPABASE_DB_USER=postgres
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}

      # Neo4j (your existing container)
      - NEO4J_URI=bolt://seo-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}

      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o

      # Embeddings
      - EMBEDDING_MODEL_NAME=hiiamsid/sentence_similarity_spanish_es
      - EMBEDDING_DIMENSION=768

      # RAG Settings
      - RAG_TOP_K_VECTORS=10
      - RAG_GRAPH_HOPS=2
      - RAG_MAX_CONTEXT_PAGES=15
    volumes:
      # Shared crawl data volume (read-write for parquet access)
      - crawl_data:/app/data/crawl4ai_data
      # Cache for HuggingFace models
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      crawler-service:
        condition: service_healthy
      seo-supabase-db:
        condition: service_started
      seo-neo4j:
        condition: service_started
    networks:
      - webknograph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Model loading takes time

  # ==========================================================================
  # CRAWLER SERVICE (Crawl4AI + Playwright/Chromium)
  # ==========================================================================
  crawler-service:
    build:
      context: .
      dockerfile: crawler_service/Dockerfile
    container_name: crawler-service
    environment:
      - CRAWL_OUTPUT_DIR=/app/data/crawl4ai_data
    volumes:
      # Shared crawl data volume (read-write for parquet output)
      - crawl_data:/app/data/crawl4ai_data
    networks:
      - webknograph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # YOUR EXISTING SERVICES (reference only - already running)
  # ==========================================================================
  # These are already defined in your existing docker-compose
  # Just showing them here for network reference

  seo-supabase-db:
    image: supabase/postgres:15.8.1.060
    container_name: seo-supabase-db
    # ... your existing config
    networks:
      - webknograph-network

  seo-supabase-api:
    image: postgrest/postgrest:v12.2.12
    container_name: seo-supabase-api
    # ... your existing config
    networks:
      - webknograph-network

  seo-neo4j:
    image: neo4j:5.20-community
    container_name: seo-neo4j
    # ... your existing config
    networks:
      - webknograph-network

volumes:
  crawl_data:
    name: webknograph-crawl-data
  huggingface_cache:
    name: graph-rag-hf-cache

networks:
  webknograph-network:
    name: webknograph-network
    external: true  # Use your existing network
