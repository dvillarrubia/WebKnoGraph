# WebKnoGraph UOC - Full local stack with separate crawler
# Containers: wkguoc-postgres, wkguoc-neo4j, wkguoc-crawler, wkguoc-app
# Coexiste en paralelo con el stack del cliente Quiron (wkg-*).

name: webknograph-uoc

services:
  wkguoc-postgres:
    image: pgvector/pgvector:pg16
    container_name: wkguoc-postgres
    ports:
      - "54323:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - wkguoc-pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  wkguoc-neo4j:
    image: neo4j:5.20-community
    container_name: wkguoc-neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j123
    volumes:
      - wkguoc-neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  wkguoc-crawler:
    build:
      context: .
      dockerfile: crawler_service/Dockerfile
    container_name: wkguoc-crawler
    ports:
      - "8082:8081"
    environment:
      - CRAWL_OUTPUT_DIR=/app/data/crawl4ai_data
    volumes:
      - wkguoc-crawl-data:/app/data/crawl4ai_data
      - ./crawler_service:/app/crawler_service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  wkguoc-app:
    build:
      context: .
      dockerfile: graph_rag/Dockerfile
    container_name: wkguoc-app
    ports:
      - "8090:8080"
    environment:
      - DEBUG=true
      - CRAWLER_SERVICE_URL=http://wkguoc-crawler:8081
      - SUPABASE_URL=http://wkguoc-postgres:5432
      - SUPABASE_SERVICE_KEY=not-needed-local
      - SUPABASE_DB_HOST=wkguoc-postgres
      - SUPABASE_DB_PORT=5432
      - SUPABASE_DB_NAME=postgres
      - SUPABASE_DB_USER=postgres
      - SUPABASE_DB_PASSWORD=postgres123
      - NEO4J_URI=bolt://wkguoc-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - OPENAI_MODEL=gpt-4o
      - EMBEDDING_MODEL_NAME=hiiamsid/sentence_similarity_spanish_es
      - EMBEDDING_DIMENSION=768
      - EMBEDDING_BATCH_SIZE=32
      - RAG_TOP_K_VECTORS=10
      - RAG_GRAPH_HOPS=2
      - RAG_MAX_CONTEXT_PAGES=15
    volumes:
      - wkguoc-crawl-data:/app/data/crawl4ai_data
      - wkguoc-hf-cache:/home/appuser/.cache/huggingface
      - ./ontologia:/app/ontologia
    depends_on:
      wkguoc-postgres:
        condition: service_healthy
      wkguoc-neo4j:
        condition: service_healthy
      wkguoc-crawler:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wkguoc-pgdata:
    name: wkguoc-pgdata
  wkguoc-neo4jdata:
    name: wkguoc-neo4jdata
  wkguoc-crawl-data:
    name: wkguoc-crawl-data
  wkguoc-hf-cache:
    name: wkguoc-hf-cache
