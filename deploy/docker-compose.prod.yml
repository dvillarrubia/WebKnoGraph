services:
  graph-rag-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      - CRAWLER_SERVICE_URL=http://crawler-service:8081
    volumes:
      - crawl_data:/app/data/crawl4ai_data
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      crawler-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webknograph-network

  crawler-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.crawler
    env_file:
      - .env.production
    volumes:
      - crawl_data:/app/data/crawl4ai_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - webknograph-network

volumes:
  crawl_data:
  huggingface_cache:

networks:
  webknograph-network:
    external: true
